name: Promote to Staging

on:
  workflow_run:
    workflows: ["Pre-deployment Test"]
    types:
      - completed
    branches:
      - dev

jobs:
  promote-to-staging:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create, push, and track temporary branch
        id: temp_branch
        run: |
          BRANCH_NAME="temp-promo-${{ github.run_id }}"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          git checkout -b $BRANCH_NAME ${{ github.event.workflow_run.head_sha }}
          git push origin $BRANCH_NAME
          git branch --set-upstream-to=origin/$BRANCH_NAME $BRANCH_NAME

      - name: Create Pull Request to Staging
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "automated: promote dev to staging"
          title: "Auto-promote: dev -> staging"
          body: |
            Automated pull request to merge `dev` into `staging`.
            Triggered by a successful run of workflow `${{ github.event.workflow_run.name }}` on commit `${{ github.event.workflow_run.head_sha }}`.
            Workflow Run ID: ${{ github.event.workflow_run.id }}
          base: staging
          branch: features/auto-promote-dev
          signoff: true
          delete-branch: true

      - name: Clean up temporary branch
        if: always()
        run: git push origin --delete ${{ steps.temp_branch.outputs.branch_name }}

      - name: Enable automerge
        if: steps.cpr.outputs.pull-request-number
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GH_PAT }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: merge
