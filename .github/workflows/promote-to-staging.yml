
name: Promote to Staging (DIAGNOSTIC)

on:
  workflow_run:
    workflows: ["Pre-deployment Test"]
    types:
      - completed
    branches:
      - dev

jobs:
  promote-to-staging-diagnostic:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the triggering commit with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Diagnose diff between HEAD and staging
        run: |
          echo ">>> Current Commit:"
          git log -1 --oneline
          
          echo " "
          echo ">>> Fetching staging branch..."
          git fetch origin staging
          
          echo " "
          echo ">>> Commits in HEAD not in origin/staging:"
          git log --oneline origin/staging..HEAD
          
          echo " "
          echo ">>> Diff summary between origin/staging and HEAD:"
          git diff --stat origin/staging HEAD
          
          echo " "
          echo ">>> If the log and diff above are empty, there are no changes."
          echo ">>> If they show changes, the problem is with the create-pull-request action."
