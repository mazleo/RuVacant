name: Promote to Staging

on:
  workflow_run:
    workflows: ["Pre-deployment Test"]
    types:
      - completed
    branches:
      - dev

jobs:
  promote-to-staging:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Create and push the promotion branch
        run: |
          BRANCH_NAME="features/auto-promote-${{ github.run_id }}"
          git checkout -b $BRANCH_NAME
          git push -u origin $BRANCH_NAME
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Create Pull Request
        run: |
          gh pr create \
            --base staging \
            --head ${{ env.BRANCH_NAME }} \
            --title "Auto-promote: dev -> staging" \
            --body "Automated PR to promote changes from dev after successful tests. Workflow run ID: ${{ github.event.workflow_run.id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable automerge
        run: |
          gh pr merge ${{ env.BRANCH_NAME }} --auto --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
