name: Promote to Staging

on:
  workflow_run:
    workflows: ["Pre-deployment Test"]
    types:
      - completed
    branches:
      - dev

jobs:
  promote-to-staging:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history for all branches
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create local branches
        run: |
          git checkout staging
          git checkout dev

      - name: Create Pull Request to Staging
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "automated: promote dev to staging"
          title: "Auto-promote: dev -> staging"
          body: |
            Automated pull request to merge `dev` into `staging`.
            Triggered by a successful run of workflow `${{ github.event.workflow_run.name }}` on commit `${{ github.event.workflow_run.head_sha }}`.
            Workflow Run ID: ${{ github.event.workflow_run.id }}
          base: staging
          branch: features/auto-promote-dev
          signoff: true
          delete-branch: true

      - name: Enable automerge
        if: steps.cpr.outputs.pull-request-number
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GH_PAT }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: merge
