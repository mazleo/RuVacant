name: Promote to Prod

on:
  workflow_run:
    workflows: ["Pre-deployment Test"]
    types:
      - completed
    branches:
      - staging

jobs:
  promote-to-prod:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the repository with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Create and push the promotion branch
        run: |
          BRANCH_NAME="features/auto-promote-prod-${{ github.run_id }}${{ github.run_attempt }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b $BRANCH_NAME
          git push -u origin $BRANCH_NAME
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Create Pull Request
        run: |
          gh pr create \
            --base prod \
            --head ${{ env.BRANCH_NAME }} \
            --title "Auto-promote: staging -> prod" \
            --body "Automated PR to promote changes from staging after successful tests. Workflow run ID: ${{ github.event.workflow_run.id }}"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
