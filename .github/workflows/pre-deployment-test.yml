name: Pre-deployment Test

on:
  push:
    branches-ignore: [ "dev", "prod" ]
  pull_request:
    branches: [ "dev", "staging", "prod" ]
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/sync
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test
        
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/sync
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run lint test
        run: npm run lint

  formatting-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/sync
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run formatting test
        run: npm run prettier:check