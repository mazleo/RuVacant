name: Pre-deployment Test

on:
  push:
    branches:
      - dev
      - staging
  pull_request:
    branches:
      - dev
      - staging
      - prod
  workflow_dispatch:

jobs:
  test-sync:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Merge pull request'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/sync
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

  lint-test-sync:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Merge pull request'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/sync
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run lint test
        run: npm run lint

  formatting-test-sync:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Merge pull request'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/sync
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run formatting test
        run: npm run prettier:check
